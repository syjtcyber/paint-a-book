<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>책칠 v0.2</title>
<style>
:root{--bg:#efe7d8;--paper:#fffaf0;--paper2:#f8f0df;--ink:#2f2a23;--muted:#7d7265;--line:#d9cdbb;--accent:#6f7d58;--accent2:#bd8f55;--accent3:#a66c4f;--shadow:0 10px 28px rgba(75,55,35,.09)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;color:var(--ink);background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,.2)),repeating-linear-gradient(0deg,transparent 0 31px,rgba(85,70,55,.045) 31px 32px),var(--bg)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{max-width:860px;margin:0 auto;padding:22px 16px 90px}.paper{background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:18px}.torn{position:relative}.torn:after{content:"";position:absolute;left:12px;right:12px;bottom:-8px;height:12px;background:radial-gradient(circle at 8px -2px,transparent 8px,var(--paper) 8.5px) 0 0/18px 12px repeat-x;filter:drop-shadow(0 2px 1px rgba(0,0,0,.04));pointer-events:none}
header{display:flex;justify-content:space-between;gap:14px;align-items:flex-end;margin-bottom:18px}.brand h1{font-size:29px;margin:0 0 3px;letter-spacing:-.05em}.brand p{margin:0;color:var(--muted);font-size:13px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 13px;font-weight:800;box-shadow:0 4px 12px rgba(60,45,30,.05)}.btn.primary{background:var(--accent);color:white;border-color:var(--accent)}.btn.dark{background:var(--ink);color:white;border-color:var(--ink)}.btn.ghost{background:transparent;box-shadow:none}.btn.danger{color:#8e4d43}.panel{padding:16px;margin-bottom:17px}.panel h2{font-size:17px;margin:0 0 14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{font-size:12px;color:var(--muted);font-weight:850}input,select,textarea{width:100%;border:1px solid var(--line);background:#fffdf8;border-radius:11px;padding:11px 12px;outline:none;color:var(--ink)}textarea{min-height:82px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--accent)}.hint{font-size:11px;color:var(--muted);line-height:1.5}.empty{border:1px dashed #cbbda9;border-radius:18px;padding:34px 16px;text-align:center;color:var(--muted);background:rgba(255,250,240,.58)}.books{display:grid;gap:14px}.book{padding:14px;display:grid;grid-template-columns:112px 1fr;gap:15px}.cover{width:112px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;position:relative;background:linear-gradient(135deg,#ddd2c1,#f3ecdf);border:1px solid rgba(0,0,0,.06)}.cover .base,.cover .fill{position:absolute;inset:0;background-size:cover;background-position:center}.cover .base{filter:grayscale(1) contrast(.92) brightness(1.06);opacity:.75}.cover .fill{clip-path:inset(var(--clip) 0 0 0);transition:clip-path .4s ease}.placeholder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-size:12px;color:#685f56;font-weight:800;background:linear-gradient(160deg,#d9cebd,#f6f0e5 60%,#cfc1ae)}.cover:not(.noimg) .placeholder{display:none}.cover.noimg .base,.cover.noimg .fill{display:none}.fill-line{position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.9);box-shadow:0 0 0 1px rgba(0,0,0,.07);top:calc(var(--clip) - 1px)}.meta{min-width:0}.title-row{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}.book-title{font-size:20px;font-weight:950;line-height:1.2;margin:2px 0 4px;word-break:keep-all}.author{font-size:13px;color:var(--muted);margin-bottom:8px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:3px 0 10px}.chip{font-size:11px;font-weight:850;border-radius:999px;padding:5px 8px;background:#efe7d8;color:#665b4f}.percent-row{display:flex;align-items:baseline;gap:7px;margin-bottom:7px}.percent{font-size:29px;font-weight:950;letter-spacing:-.04em}.pages{font-size:13px;color:var(--muted)}.bar{height:11px;border-radius:999px;background:#e7ddcf;overflow:hidden;margin-bottom:10px}.bar>i{display:block;height:100%;width:var(--p);background:linear-gradient(90deg,var(--accent2),var(--accent));border-radius:inherit;transition:width .35s ease}.statusline{display:flex;flex-wrap:wrap;gap:7px 12px;color:var(--muted);font-size:12px;margin-bottom:10px}.quick{display:flex;flex-wrap:wrap;gap:7px}.quick button{border:1px solid var(--line);background:#fbf7ef;border-radius:10px;padding:8px 10px;font-weight:850}.quick .done{background:var(--accent);border-color:var(--accent);color:#fff}.quick .active{background:#5e6f49;color:white;border-color:#5e6f49}.small-menu{display:flex;gap:5px}.iconbtn{border:0;background:transparent;color:var(--muted);padding:4px 5px;border-radius:8px;font-weight:900}.finished-badge{display:inline-flex;align-items:center;gap:5px;background:#ebf0e3;color:#586c49;border-radius:999px;padding:5px 8px;font-size:11px;font-weight:900;margin-top:8px}.logs{margin-top:11px;border-top:1px dashed var(--line);padding-top:9px}.logs summary{cursor:pointer;font-size:12px;font-weight:900;color:#675b4e}.log{background:var(--paper2);border:1px solid #e4d7c4;border-radius:10px;padding:9px;margin-top:7px}.log-top{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted)}.stars{letter-spacing:1px;color:#b57b2a;font-size:13px}.comment{font-size:12px;margin-top:4px;line-height:1.45}.notice{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:#27231f;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:30;white-space:nowrap}.notice.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(48,39,30,.28);display:none;align-items:center;justify-content:center;padding:18px;z-index:25}.modal.show{display:flex}.sheet{width:min(520px,100%);background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 20px 50px rgba(40,30,20,.2)}.sheet h3{margin:0 0 12px}.row{display:flex;gap:8px}.row>*{flex:1}.starpick{display:flex;gap:5px}.starpick button{font-size:27px;line-height:1;border:0;background:transparent;color:#cfc5b7;padding:2px}.starpick button.on{color:#b57b2a}.sessionbox{background:#f3eadb;border:1px solid #dbcdb9;border-radius:14px;padding:12px;margin:10px 0}.timer{font-variant-numeric:tabular-nums;font-size:28px;font-weight:950;letter-spacing:.03em}.note-strip{margin:0 0 16px;padding:12px 14px;border:1px dashed #cbb99f;background:#f5ead5;border-radius:14px;font-size:13px;color:#675d50}
@media(max-width:600px){.wrap{padding:18px 12px 72px}.brand h1{font-size:25px}.book{grid-template-columns:94px 1fr;padding:12px}.cover{width:94px}.book-title{font-size:17px}.percent{font-size:25px}.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.top-actions .btn{padding:9px 10px}.row{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><h1>책칠 <span style="font-size:13px;color:var(--muted);font-weight:800">v0.2</span></h1><p>읽은 만큼, 텍스트에 색이 돌아옵니다.</p></div><div class="top-actions"><button class="btn" id="exportBtn">백업</button><button class="btn" id="importBtn">복원</button><input id="importFile" type="file" accept="application/json" hidden><button class="btn primary" id="toggleAdd">텍스트 추가</button></div></header>
<div class="note-strip">종이책 · 전자책 · 웹소설 · 긴 글/PDF를 같은 방식으로 기록합니다. 진행 단위만 다르게 잡습니다.</div>
<section class="panel paper torn" id="addPanel" hidden>
<h2>새 텍스트 등록</h2>
<div class="grid">
<div class="field full"><label>표지 / 대표 이미지</label><input id="coverInput" type="file" accept="image/*"><div class="hint">선택 사항. 이미지는 이 기기 브라우저에 저장됩니다.</div></div>
<div class="field"><label>종류</label><select id="typeInput"><option value="paper">종이책</option><option value="ebook">전자책</option><option value="webnovel">웹소설</option><option value="longform">긴 글 / PDF</option></select></div>
<div class="field"><label>제목</label><input id="titleInput" placeholder="예: 달의 위로"></div>
<div class="field"><label>작가 / 출처</label><input id="authorInput" placeholder="예: 작가 이름"></div>
<div class="field" id="deviceField" hidden><label>전자책 기기</label><select id="deviceInput"><option value="스마트폰">스마트폰</option><option value="태블릿">태블릿</option><option value="PC">PC</option><option value="기타">기타</option></select></div>
<div class="field" id="unitField"><label>진행 단위</label><select id="unitInput"><option value="page">페이지</option><option value="percent">%</option><option value="episode">화</option></select></div>
<div class="field"><label id="totalLabel">전체 페이지</label><input id="totalInput" type="number" min="1" inputmode="numeric" placeholder="320"></div>
<div class="field"><label id="currentLabel">현재 페이지</label><input id="currentInput" type="number" min="0" inputmode="numeric" placeholder="0"></div>
<div class="field" id="paperGuessField" hidden><label>종이책 기준 총 페이지 (선택)</label><input id="paperTotalInput" type="number" min="1" inputmode="numeric" placeholder="예: 328"><div class="hint">전자책 진행률을 종이책 위치로 가늠할 때만 사용합니다.</div></div>
</div>
<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn ghost" id="cancelAdd">취소</button><button class="btn primary" id="saveBook">등록</button></div>
</section>
<section id="bookList"></section>
</div>
<div class="notice" id="notice">저장했어요.</div>
<div class="modal" id="logModal"><div class="sheet"><h3 id="logTitle">읽은 구간 기록</h3><div class="row"><div class="field"><label>시작 위치</label><input id="logStart" type="number"></div><div class="field"><label>끝 위치</label><input id="logEnd" type="number"></div></div><div class="field" style="margin-top:10px"><label>별점</label><div class="starpick" id="starPick"></div></div><div class="field" style="margin-top:10px"><label>코멘트 (선택)</label><textarea id="logComment" placeholder="이 구간은 어땠나요?"></textarea></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn ghost" id="skipLog">건너뛰기</button><button class="btn primary" id="saveLog">기록하기</button></div></div></div>
<div class="modal" id="sessionModal"><div class="sheet"><h3>독서 중</h3><div class="sessionbox"><div style="font-size:12px;color:var(--muted)">시작 시간</div><div id="sessionStartText" style="font-weight:850;margin:4px 0 10px"></div><div class="timer" id="timer">00:00:00</div></div><div class="field"><label id="sessionEndLabel">현재 위치</label><input id="sessionEnd" type="number"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn ghost" id="closeSession">닫기</button><button class="btn dark" id="finishSession">읽기 종료</button></div></div></div>
<script>
const KEY='bookcolor_v02';const OLDKEY='bookcolor_v01';let books=loadBooks();let logTarget=null,selectedStars=0,activeSession=null,timerInt=null;
function loadBooks(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v)return v;const old=JSON.parse(localStorage.getItem(OLDKEY));if(old){return old.map(b=>({...b,type:'paper',unit:'page',device:'',paperTotal:null,logs:[],sessions:[],firstStartedAt:null,lastEndedAt:null}))}return[]}catch(e){return[]}}
function saveBooks(){localStorage.setItem(KEY,JSON.stringify(books));render()}
function clamp(v,min,max){return Math.max(min,Math.min(max,v))}
function pct(b){if(b.unit==='percent')return clamp(Math.round(b.current),0,100);return b.total?clamp(Math.round(b.current/b.total*100),0,100):0}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function toast(text){const n=document.getElementById('notice');n.textContent=text;n.classList.add('show');clearTimeout(window.__t);window.__t=setTimeout(()=>n.classList.remove('show'),1500)}
function fmt(dt){if(!dt)return'-';const d=new Date(dt);return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`}
function dur(ms){const m=Math.max(0,Math.round(ms/60000));if(m<60)return`${m}분`;return`${Math.floor(m/60)}시간 ${m%60}분`}
function typeName(t){return {paper:'종이책',ebook:'전자책',webnovel:'웹소설',longform:'긴 글/PDF'}[t]||t}
function unitSuffix(b){return b.unit==='page'?'p':b.unit==='episode'?'화':'%'}
function avgRating(b){const xs=(b.logs||[]).filter(x=>x.rating);if(!xs.length)return null;return (xs.reduce((a,x)=>a+x.rating,0)/xs.length).toFixed(1)}
function progressText(b){if(b.unit==='percent')return `${b.current}%`;return `${b.current.toLocaleString()} / ${b.total?.toLocaleString?.()||b.total}${unitSuffix(b)}`}
function paperGuess(b){if(b.type==='ebook'&&b.paperTotal&&pct(b)>=0)return Math.round(b.paperTotal*pct(b)/100);return null}
async function imageToDataURL(file){if(!file)return'';return new Promise((resolve,reject)=>{const img=new Image(),fr=new FileReader();fr.onload=()=>img.src=fr.result;fr.onerror=reject;img.onload=()=>{const maxW=700,maxH=1050,r=Math.min(1,maxW/img.width,maxH/img.height),w=Math.round(img.width*r),h=Math.round(img.height*r),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);resolve(c.toDataURL('image/jpeg',.82))};img.onerror=reject;fr.readAsDataURL(file)})}
function render(){const el=document.getElementById('bookList');if(!books.length){el.innerHTML='<div class="empty"><div style="font-size:34px;margin-bottom:8px">📚</div><b>아직 기록한 텍스트가 없어요.</b><div style="font-size:13px;margin-top:6px">읽을 것을 하나 등록하고, 읽은 만큼 색을 채워보세요.</div></div>';return}el.innerHTML='<div class="books">'+books.map(b=>{const p=pct(b),clip=100-p,done=p>=100,bg=b.cover?`background-image:url("${b.cover}")`:'',rating=avgRating(b),guess=paperGuess(b),active=b.activeSession;return `<article class="book paper torn" data-id="${b.id}"><div class="cover ${b.cover?'':'noimg'}" style="--clip:${clip}%"><div class="base" style='${bg}'></div><div class="fill" style='${bg}'></div><div class="placeholder">${esc(b.title||'표지 없음')}</div>${b.cover?'<div class="fill-line"></div>':''}</div><div class="meta"><div class="title-row"><div><div class="book-title">${esc(b.title)}</div><div class="author">${b.author?esc(b.author):'작가/출처 미입력'}</div></div><div class="small-menu"><button class="iconbtn" data-act="edit">수정</button><button class="iconbtn" data-act="delete">삭제</button></div></div><div class="chips"><span class="chip">${typeName(b.type)}</span>${b.device?`<span class="chip">${esc(b.device)}</span>`:''}<span class="chip">${b.unit==='page'?'페이지':b.unit==='episode'?'화':'진행률'}</span></div><div class="percent-row"><span class="percent">${p}%</span><span class="pages">${progressText(b)}</span></div><div class="bar" style="--p:${p}%"><i></i></div><div class="statusline"><span>시작 ${fmt(b.firstStartedAt)}</span><span>최근 종료 ${fmt(b.lastEndedAt)}</span>${guess!==null?`<span>종이책 기준 약 ${guess}/${b.paperTotal}p</span>`:''}${rating?`<span>★ ${rating}</span>`:''}</div><div class="quick">${b.unit==='page'?'<button data-act="plus" data-n="1">+1p</button><button data-act="plus" data-n="5">+5p</button><button data-act="plus" data-n="10">+10p</button>':''}${b.unit==='episode'?'<button data-act="plus" data-n="1">+1화</button><button data-act="plus" data-n="5">+5화</button>':''}<button data-act="progress">진행 입력</button><button class="${active?'active':''}" data-act="session">${active?'독서 중':'읽기 시작'}</button><button data-act="log">구간 기록</button><button class="${done?'done':''}" data-act="finish">${done?'완독 ✓':'완독'}</button></div>${done?'<div class="finished-badge">● 끝까지 읽었어요</div>':''}<details class="logs"><summary>구간 기록 ${(b.logs||[]).length}개 보기</summary>${(b.logs||[]).slice().reverse().map(l=>`<div class="log"><div class="log-top"><span>${l.start}${unitSuffix(b)} → ${l.end}${unitSuffix(b)}</span><span>${fmt(l.endedAt||l.createdAt)}${l.durationMs?` · ${dur(l.durationMs)}`:''}</span></div><div class="stars">${l.rating?'★'.repeat(l.rating)+'☆'.repeat(5-l.rating):'별점 없음'}</div>${l.comment?`<div class="comment">${esc(l.comment)}</div>`:''}</div>`).join('')}</details></div></article>`}).join('')+'</div>'}
function updateForm(){const t=document.getElementById('typeInput').value;document.getElementById('deviceField').hidden=t!=='ebook';document.getElementById('paperGuessField').hidden=t!=='ebook';const u=document.getElementById('unitInput');if(t==='paper'){u.value='page'}else if(t==='webnovel'){u.value='episode'}else if(t==='ebook'){u.value='percent'}else if(t==='longform'){u.value='percent'}updateLabels()}
function updateLabels(){const u=document.getElementById('unitInput').value;document.getElementById('totalLabel').textContent=u==='page'?'전체 페이지':u==='episode'?'전체 화수':'전체 진행률';document.getElementById('currentLabel').textContent=u==='page'?'현재 페이지':u==='episode'?'현재 화':'현재 진행률';if(u==='percent'){document.getElementById('totalInput').value=100;document.getElementById('totalInput').disabled=true}else document.getElementById('totalInput').disabled=false}
document.getElementById('typeInput').onchange=updateForm;document.getElementById('unitInput').onchange=updateLabels;updateForm();
document.getElementById('toggleAdd').onclick=()=>{const p=document.getElementById('addPanel');p.hidden=!p.hidden;if(!p.hidden)document.getElementById('titleInput').focus()};document.getElementById('cancelAdd').onclick=()=>document.getElementById('addPanel').hidden=true;
document.getElementById('saveBook').onclick=async()=>{const title=titleInput.value.trim(),author=authorInput.value.trim(),type=typeInput.value,unit=unitInput.value,device=type==='ebook'?deviceInput.value:'';let total=unit==='percent'?100:parseInt(totalInput.value,10),current=parseInt(currentInput.value||'0',10),paperTotal=parseInt(paperTotalInput.value||'',10);if(!title){toast('제목을 입력해주세요.');return}if(!total||total<1){toast('전체 분량을 입력해주세요.');return}current=clamp(isNaN(current)?0:current,0,total);let cover='';const file=coverInput.files[0];try{if(file)cover=await imageToDataURL(file)}catch(e){toast('이미지를 읽지 못했어요.')}books.unshift({id:uid(),title,author,type,unit,device,total,current,paperTotal:isNaN(paperTotal)?null:paperTotal,cover,logs:[],sessions:[],firstStartedAt:null,lastEndedAt:null,activeSession:null});['titleInput','authorInput','totalInput','currentInput','paperTotalInput','coverInput'].forEach(id=>document.getElementById(id).value='');document.getElementById('addPanel').hidden=true;saveBooks();toast('등록했어요.')}
function openLog(b,start=b.current,end=b.current,session=null){logTarget={b,session};selectedStars=0;logStart.value=start;logEnd.value=end;logComment.value='';renderStars();logTitle.textContent=`「${b.title}」 읽은 구간`;logModal.classList.add('show')}
function renderStars(){starPick.innerHTML=[1,2,3,4,5].map(n=>`<button data-star="${n}" class="${n<=selectedStars?'on':''}">★</button>`).join('')}
starPick.onclick=e=>{const b=e.target.closest('button[data-star]');if(!b)return;selectedStars=parseInt(b.dataset.star);renderStars()};skipLog.onclick=()=>logModal.classList.remove('show');saveLog.onclick=()=>{if(!logTarget)return;const {b,session}=logTarget;const start=parseFloat(logStart.value),end=parseFloat(logEnd.value);if(isNaN(start)||isNaN(end)){toast('구간을 입력해주세요.');return}(b.logs||(b.logs=[])).push({id:uid(),start,end,rating:selectedStars||null,comment:logComment.value.trim(),createdAt:new Date().toISOString(),endedAt:session?.endedAt||new Date().toISOString(),durationMs:session?.durationMs||null});logModal.classList.remove('show');saveBooks();toast('구간 기록을 저장했어요.')}
function openSession(b){activeSession=b;if(!b.activeSession){b.activeSession={startedAt:new Date().toISOString(),startValue:b.current};if(!b.firstStartedAt)b.firstStartedAt=b.activeSession.startedAt;saveBooks()}sessionStartText.textContent=fmt(b.activeSession.startedAt);sessionEnd.value=b.current;sessionEndLabel.textContent=`현재 ${b.unit==='page'?'페이지':b.unit==='episode'?'화':'진행률'}`;sessionModal.classList.add('show');startTimer(b.activeSession.startedAt)}
function startTimer(start){clearInterval(timerInt);const tick=()=>{const s=Math.floor((Date.now()-new Date(start).getTime())/1000),h=String(Math.floor(s/3600)).padStart(2,'0'),m=String(Math.floor(s%3600/60)).padStart(2,'0'),sec=String(s%60).padStart(2,'0');timer.textContent=`${h}:${m}:${sec}`};tick();timerInt=setInterval(tick,1000)}
closeSession.onclick=()=>{sessionModal.classList.remove('show');clearInterval(timerInt)};finishSession.onclick=()=>{if(!activeSession||!activeSession.activeSession)return;const b=activeSession,end=parseFloat(sessionEnd.value);if(isNaN(end)){toast('현재 위치를 입력해주세요.');return}b.current=clamp(end,0,b.total);const endedAt=new Date().toISOString(),s=b.activeSession,session={id:uid(),startedAt:s.startedAt,endedAt,startValue:s.startValue,endValue:b.current,durationMs:new Date(endedAt)-new Date(s.startedAt)};(b.sessions||(b.sessions=[])).push(session);b.lastEndedAt=endedAt;b.activeSession=null;sessionModal.classList.remove('show');clearInterval(timerInt);saveBooks();openLog(b,session.startValue,session.endValue,session)}
document.getElementById('bookList').onclick=e=>{const btn=e.target.closest('button[data-act]');if(!btn)return;const card=btn.closest('.book'),b=books.find(x=>x.id===card.dataset.id);if(!b)return;const act=btn.dataset.act;if(act==='plus'){b.current=clamp(b.current+parseInt(btn.dataset.n,10),0,b.total);saveBooks();toast(`+${btn.dataset.n}${unitSuffix(b)}`)}else if(act==='finish'){b.current=b.total;b.lastEndedAt=b.lastEndedAt||new Date().toISOString();saveBooks();toast('완독으로 표시했어요.')}else if(act==='progress'){const v=prompt(`현재 ${b.unit==='page'?'페이지':b.unit==='episode'?'화':'진행률'}를 입력하세요. (0~${b.total})`,b.current);if(v===null)return;const n=parseFloat(v);if(isNaN(n)){toast('숫자로 입력해주세요.');return}b.current=clamp(n,0,b.total);saveBooks();toast('진행률을 업데이트했어요.')}else if(act==='session'){openSession(b)}else if(act==='log'){const prev=(b.logs||[]).at(-1);openLog(b,prev?prev.end:0,b.current)}else if(act==='delete'){if(confirm(`「${b.title}」을 삭제할까요?`)){books=books.filter(x=>x.id!==b.id);saveBooks();toast('삭제했어요.')}}else if(act==='edit'){const t=prompt('제목',b.title);if(t===null||!t.trim())return;const a=prompt('작가 / 출처',b.author||'');if(a===null)return;const total=parseInt(prompt('전체 분량',b.total),10);if(!total||total<1)return;const cur=parseFloat(prompt('현재 위치',b.current));b.title=t.trim();b.author=a.trim();b.total=total;b.current=clamp(isNaN(cur)?0:cur,0,total);saveBooks();toast('수정했어요.')}}
exportBtn.onclick=()=>{if(!books.length){toast('백업할 기록이 없어요.');return}const blob=new Blob([JSON.stringify({app:'책칠 v0.2',exportedAt:new Date().toISOString(),books},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='책칠_v0.2_백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),500);toast('백업 파일을 만들었어요.')};importBtn.onclick=()=>importFile.click();importFile.onchange=async()=>{const f=importFile.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data.books))throw new Error();if(confirm('현재 기록을 백업 파일 내용으로 바꿀까요?')){books=data.books;saveBooks();toast('복원했어요.')}}catch(e){toast('백업 파일을 읽지 못했어요.')}importFile.value=''};render();
</script>
